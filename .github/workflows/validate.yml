name: validate

on:
  push:
  pull_request:

jobs:
  schema:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install validator dependency
        run: python -m pip install --upgrade pip jsonschema referencing

      - name: Run schema tests
        run: python -m unittest tests.test_schema -v

      - name: Run agent lifecycle profile tests
        run: python -m unittest tests.test_agent_lifecycle_profile -v

      - name: Run adjacent profile tests
        run: python -m unittest tests.test_adjacent_profiles -v

      - name: Run documentation drift tests
        run: python -m unittest tests.test_doc_drift -v

      - name: Confirm spec and site schemas stay identical
        run: diff -u spec/v1/schema.json site/v1/schema.json
